<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061024" />
      <stop offset="100%" stop-color="#0A1F44" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#C9A84C" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3" />
  <!-- Candlestick & Bullish Trend Logo -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Candlestick 1 -->
    <line x1="80" y1="160" x2="80" y2="380" stroke="#34D399" stroke-width="8" stroke-linecap="round" />
    <rect x="60" y="200" width="40" height="130" rx="6" fill="#34D399" />
    <!-- Candlestick 2 -->
    <line x1="170" y1="100" x2="170" y2="320" stroke="#C9A84C" stroke-width="8" stroke-linecap="round" />
    <rect x="150" y="140" width="40" height="110" rx="6" fill="#C9A84C" />
    <!-- Candlestick 3 -->
    <line x1="260" y1="60" x2="260" y2="280" stroke="#34D399" stroke-width="8" stroke-linecap="round" />
    <rect x="240" y="80" width="40" height="140" rx="6" fill="#34D399" />
    <!-- Exponential Growth Line -->
    <path d="M 40 360 Q 180 320 280 120 T 420 50" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" />
    <!-- Arrow Head -->
    <polygon points="420,30 450,55 425,75" fill="#FCD34D" />
  </g>
  <!-- Text Label -->
  <text x="256" y="440" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="900" font-size="52" fill="#FCD34D" text-anchor="middle" letter-spacing="4">PSA BROKER</text>
  <text x="256" y="475" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="600" font-size="22" fill="#94A3B8" text-anchor="middle" letter-spacing="2">NAIRASTOCK ACADEMY</text>
</svg>
